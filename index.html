const CATEGORY_ICONS={"Technical SEO":"⚙️","Analytics":"📊","Local SEO":"📍","Content Accuracy":"✏️"};
let activeTab="summary",selectedHotel="All Properties";

function badgeHTML(s){if(!s)return'';const l=s.toLowerCase();let c='badge-green';if(l.includes('progress'))c='badge-amber';else if(l.includes('analysis'))c='badge-blue';return`<span class="badge ${c}">${s}</span>`}
function linkPill(u,l){return`<a class="link-pill" href="${u}" target="_blank" rel="noopener">${extLink} ${l}</a>`}
function filter(a){return selectedHotel==="All Properties"?a:a.filter(t=>t.hotel===selectedHotel||(t.also||[]).includes(selectedHotel)||t.hotel==="All Properties");}

function renderFilters(){document.getElementById('hotelFilters').innerHTML=HOTELS.map(h=>`<button class="hotel-btn ${h===selectedHotel?'active':''}" onclick="selectHotel('${h}')">${h}</button>`).join('')}

function renderSummary(){
const data=selectedHotel==="All Properties"?SUMMARY:SUMMARY.filter(s=>s.hotel===selectedHotel||(s.also||[]).includes(selectedHotel));
const sc=filter(SEO_TASKS).length,dc=filter(SDEV_TASKS).length,gc=filter(DEV_TASKS).length;
const comp=filter(SEO_TASKS).filter(t=>["Implemented","Update Posted"].includes(t.status)).length+filter(SDEV_TASKS).filter(t=>t.status==="Done").length+filter(DEV_TASKS).filter(t=>t.status==="Done").length;
const total=sc+dc+gc;const pct=total>0?Math.round(comp/total*100):0;
const showAll=selectedHotel==="All Properties";
const seasonHtml=showAll?`<div class="season-banner fade-up"><div class="banner-header"><div class="banner-icon">🎁</div><div><div class="banner-title">Gathering Season & Insiders Enjoy More — Seasonal Offer Rollout</div><div class="banner-sub">SEO, landing pages, offers, and FAQs delivered across the portfolio</div></div></div><p class="banner-text">This week's headline work was the seasonal offer rollout: SEO for the new Gathering Season pages and Insiders Enjoy More offers, the updated main offer page, and landing pages for Ingleside Estate and Avalon Palm Springs.</p><div class="banner-grid">${SEASON.map(a=>`<div class="banner-item"><div class="banner-item-title">${a.title}</div><div class="banner-item-text">${a.text}</div></div>`).join('')}</div></div>`:'';
const awaitHtml=showAll?`<div class="await-strip fade-up"><div class="await-title">⏳ Awaiting Your Input</div><div class="await-list">${AWAITING.map(a=>`<div class="await-item"><strong>${a.who}:</strong> ${a.what}</div>`).join('')}</div></div>`:'';
let h=`${seasonHtml}${awaitHtml}<div class="stat-row fade-up">
<div class="stat-card"><div class="stat-card-val purple">${sc}</div><div class="stat-card-label">SEO Tasks</div></div>
<div class="stat-card"><div class="stat-card-val blue">${dc}</div><div class="stat-card-label">SEO Dev Tasks</div></div>
<div class="stat-card"><div class="stat-card-val teal">${gc}</div><div class="stat-card-label">Dev & Design</div></div>
<div class="stat-card"><div class="stat-card-val green">${pct}%</div><div class="stat-card-label">Completion</div></div>
<div class="stat-card"><div class="stat-card-val amber">${data.length}</div><div class="stat-card-label">Hotels</div></div></div>`;
data.forEach((s,i)=>{const c=HOTEL_COLORS[s.hotel]||"#7c3aed";const meta=[s.seo&&`${s.seo} SEO`,s.dev&&`${s.dev} Dev`].filter(Boolean).join(' · ')||'Monitoring';
h+=`<div class="summary-card fade-up delay-${Math.min(i+1,4)}"><div class="summary-header"><div class="summary-hotel-info"><div class="hotel-avatar" style="background:linear-gradient(135deg,${c},${c}aa)">${s.hotel.charAt(0)}</div><div><div class="summary-hotel-name">${s.hotel}</div><div class="summary-hotel-meta">${meta} this week</div></div></div><div class="badge-complete">✓ Completed</div></div><p class="summary-text">${s.summary}</p><div class="wins-box"><div class="wins-label">🏆 Expected Key Wins</div><div class="wins-tags">${s.wins.map(w=>`<span class="win-tag">${w}</span>`).join('')}</div></div></div>`;});
document.getElementById('section-summary').innerHTML=h;document.getElementById('heroTotal').textContent=total;document.getElementById('heroCompleted').textContent=comp;}

function renderSEO(){
const tasks=filter(SEO_TASKS);let h='';
tasks.forEach(t=>{const icon=CATEGORY_ICONS[t.category]||'📋';
const links=t.links.length?`<div class="task-links-label">Task References</div><div class="task-links">${t.links.map(l=>linkPill(l.url,l.label)).join('')}</div>`:'';
h+=`<div class="task-card" id="seo-${t.id}"><div class="task-head" onclick="toggleTask('seo',${t.id})"><div class="task-head-left"><div class="task-icon">${icon}</div><div><div class="task-title">${t.title}</div><div class="task-meta">${t.hotel} · ${t.source} · ${t.category}</div></div></div><div class="task-head-right">${badgeHTML(t.status)}<span class="chevron">▾</span></div></div><div class="task-body"><div class="task-body-inner"><div class="task-columns"><div><div class="task-col-label">What Was Found</div><div class="task-col-text">${t.description}</div></div><div><div class="task-col-label">Action Taken</div><div class="task-col-text">${t.action}</div></div></div>${links}</div></div></div>`;});
document.getElementById('section-seo').innerHTML=h||'<p style="color:var(--ink-muted);text-align:center;padding:40px 0">No SEO tasks for this property.</p>';}

function renderSDev(){
const tasks=filter(SDEV_TASKS);let h='';
tasks.forEach(t=>{h+=`<div class="task-card dev-card" id="sdev-${t.id}"><div class="task-head" onclick="toggleTask('sdev',${t.id})"><div class="task-head-left"><div class="dev-num">${t.id}</div><div><div class="task-title">${t.title}</div><div class="task-meta">${t.hotel} · via Asana</div></div></div><div class="task-head-right">${badgeHTML(t.status)}<span class="chevron">▾</span></div></div><div class="task-body"><div class="task-body-inner"><p class="task-col-text" style="margin-bottom:14px">${t.description}</p><div class="task-links">${linkPill(t.link,'View Task')}</div></div></div></div>`;});
document.getElementById('section-sdev').innerHTML=h||'<p style="color:var(--ink-muted);text-align:center;padding:40px 0">No SEO dev tasks for this property.</p>';}

function renderDev(){
const tasks=filter(DEV_TASKS);let h='';
tasks.forEach(t=>{h+=`<div class="task-card design-card" id="dev-${t.id}"><div class="task-head" onclick="toggleTask('dev',${t.id})"><div class="task-head-left"><div class="design-num">${t.id}</div><div><div class="task-title">${t.title}</div><div class="task-meta">${t.hotel} · Dev & Design</div></div></div><div class="task-head-right">${badgeHTML(t.status)}<span class="chevron">▾</span></div></div><div class="task-body"><div class="task-body-inner"><p class="task-col-text">${t.description}</p></div></div></div>`;});
document.getElementById('section-dev').innerHTML=h||'<p style="color:var(--ink-muted);text-align:center;padding:40px 0">No dev or design tasks for this property.</p>';}

function switchTab(tab){activeTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===`section-${tab}`));}
function selectHotel(h){selectedHotel=h;renderFilters();renderSummary();renderSEO();renderSDev();renderDev();}
function toggleTask(p,id){const el=document.getElementById(`${p}-${id}`);if(!el)return;const w=el.classList.contains('open');document.querySelectorAll(`#section-${p} .task-card`).forEach(c=>c.classList.remove('open'));if(!w)el.classList.add('open');}

renderFilters();renderSummary();renderSEO();renderSDev();renderDev();
</script>
